version: '3.8'

services:
  api:
    image: 754724220380.dkr.ecr.ap-southeast-2.amazonaws.com/watchme-behavior-analysis-feature-extractor:latest
    container_name: behavior-analysis-feature-extractor
    ports:
      - "127.0.0.1:8017:8017"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION}
      - FEATURE_COMPLETED_QUEUE_URL=${FEATURE_COMPLETED_QUEUE_URL}
      - SED_JOB_QUEUE_ENABLED=${SED_JOB_QUEUE_ENABLED:-true}
      - SED_JOB_QUEUE_URL=${SED_JOB_QUEUE_URL:-https://sqs.ap-southeast-2.amazonaws.com/754724220380/watchme-sed-job-queue-v1.fifo}
      - SED_JOB_QUEUE_WAIT_SECONDS=${SED_JOB_QUEUE_WAIT_SECONDS:-20}
      - SED_JOB_QUEUE_VISIBILITY_TIMEOUT=${SED_JOB_QUEUE_VISIBILITY_TIMEOUT:-600}
      - SED_ALLOW_IN_PROCESS_FALLBACK=${SED_ALLOW_IN_PROCESS_FALLBACK:-false}
      - SED_MODEL_BACKEND=${SED_MODEL_BACKEND:-ast_hf}
      - SED_MODEL_NAME=${SED_MODEL_NAME:-MIT/ast-finetuned-audioset-10-10-0.4593}
      - SED_ENABLE_BLACKLIST_FILTER=${SED_ENABLE_BLACKLIST_FILTER:-false}
      - SED_ENABLE_LABEL_MERGE=${SED_ENABLE_LABEL_MERGE:-false}
      - PYTHONUNBUFFERED=1
    restart: always
    networks:
      - watchme-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8017/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 2g
    cpus: 1.0

networks:
  watchme-network:
    external: true
